<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الكهرباء – الفني ثامر عبيدات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151f;--card:#1a2232;--ink:#f1ece0;--mute:#9aa6bb;--gold:#f2b632;--ok:#4cc38a;--bad:#e5735a;--line:#2c3850;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;font-weight:900;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 10px;font-size:.95rem}
svg{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.lamp{fill:#3a3f4a;transition:fill .5s,filter .5s}
.on .lamp{fill:#ffe9a8;filter:drop-shadow(0 0 7px #ffd35c)}
.wires{opacity:0;transition:opacity .4s}
.show .wires{opacity:1}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 14px;font-size:.9rem}
.tog{background:none;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:3px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}
.card h2{margin:0 0 6px;font-size:1.15rem}
.card p{margin:0 0 10px}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;margin:8px 0;font:inherit;cursor:pointer;min-height:52px}
.opt:focus-visible,.tog:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:#173528}
.opt.bad{border-color:var(--bad);background:#3a2019}
.fb{margin:8px 0;font-weight:700}
.tip{border-right:4px solid var(--gold);background:#2a2616;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:.95rem}
.go{background:var(--gold);color:#1b1500;border:0;border-radius:12px;padding:14px;width:100%;font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer;margin-top:12px}
.note{color:var(--mute);font-size:.82rem;text-align:center;margin:14px 0}
.cert{text-align:center;border:2px solid var(--gold)}
.cert a{color:var(--gold);font-weight:900;font-size:1.3rem;text-decoration:none;direction:ltr;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
<h1>⚡ رحلة الكهرباء</h1>
<p class="sub">كيف تصل الكهرباء إلى إنارة مدخل المبنى؟ تعلّم خطوات العمل الصحيح مع الفني ثامر عبيدات.</p>

<div id="scene">
<svg viewBox="0 0 400 220" role="img" aria-label="رسم لمدخل مبنى مضاء ليلًا">
<rect width="400" height="220" fill="#0a0e16"/>
<rect x="20" y="40" width="360" height="160" fill="#cfc4ad"/>
<path d="M10 40 L60 12 H340 L390 40Z" fill="#7a3b2a"/>
<rect x="60" y="48" width="280" height="14" fill="#efe7d6"/>
<rect x="70" y="62" width="260" height="36" fill="#b9ad95"/>
<rect x="68" y="62" width="10" height="138" fill="#e4dccb"/><rect x="322" y="62" width="10" height="138" fill="#e4dccb"/>
<rect x="150" y="104" width="100" height="96" fill="#1b1612"/><rect x="165" y="114" width="70" height="76" rx="3" fill="none" stroke="#8a6d3b" stroke-width="2"/>
<g fill="#5b6a74"><path d="M30 190V120q0-22 18-22t18 22v70z"/><path d="M95 190V130q0-18 14-18t14 18v60z"/><path d="M277 190V130q0-18 14-18t14 18v60z"/><path d="M334 190V120q0-22 18-22t18 22v70z"/></g>
<g id="lamps"></g>
<g class="wires" fill="none" stroke-width="2.2" stroke-dasharray="5 3">
<path d="M200 98V80H92M200 80H308" stroke="#e08a3c"/>
<path d="M200 98V84H92M200 84H308" stroke="#5aa2e8"/>
<path d="M200 98V88H92M200 88H308" stroke="#9ccf4f"/>
<path d="M200 98V150" stroke="#e08a3c"/><rect x="333" y="130" width="12" height="18" fill="#f1ece0" stroke="none"/>
<path d="M339 130V88H308" stroke="#e08a3c"/>
</g>
<text class="wires" x="200" y="214" fill="#9aa6bb" font-size="9" text-anchor="middle" font-family="Cairo">الخطوط المنقطعة: أسلاك مخفية داخل السقف والجدار</text>
</svg>
<div class="bar"><span class="pill" id="score">النقاط: 0</span><button class="tog" id="tog">إظهار الأسلاك المخفية</button></div>
</div>

<div id="stage"></div>
<p class="note">هذه محاكاة تعليمية للتوعية. تنفيذ أي عمل كهربائي فعلي يتم بواسطة فني مرخّص.</p>
</div>

<script>
var L=document.getElementById('lamps'),xs=[95,125,155,185,215,245,275,305],i;
for(i=0;i<xs.length;i++){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',xs[i]);c.setAttribute('cy',80);c.setAttribute('r',5);c.setAttribute('class','lamp');L.appendChild(c)}
var S=[
{t:'١. التخطيط',q:'قبل فتح أي جدار أو سقف، ما أول خطوة؟',o:['رسم مخطط لأماكن الإنارة والمفاتيح والدوائر','البدء بتمرير الأسلاك مباشرة','شراء أكبر عدد من الإضاءات'],a:0,w:'التخطيط أولًا يوفّر الوقت والمال ويمنع التعديل بعد التشطيب.',tip:'يحدد الفني أماكن الإضاءات وتوزيعها بالتساوي حتى لا تظهر بقع مظلمة.'},
{t:'٢. المسارات',q:'متى تُمرَّر الأنابيب والأسلاك داخل السقف والجدران؟',o:['بعد الدهان والتلبيس','قبل التشطيب والتلبيس، داخل أنابيب حماية','بأسلاك مكشوفة على السطح'],a:1,w:'تمرير الأسلاك داخل أنابيب قبل التشطيب يحميها ويبقي المظهر نظيفًا ويسهّل تبديلها لاحقًا.',tip:'تُحفظ مسارات الأسلاك مرتبة ومحددة حتى لا يصيبها مسمار أو ثقب في المستقبل.'},
{t:'٣. اختيار المواد',q:'كيف يُختار مقطع الكابل والقاطع لدائرة الإنارة؟',o:['حسب الحمل الكهربائي للدائرة وبمواد مطابقة للمواصفات','أرخص كابل متوفر','أي قاطع يناسب مكان اللوحة'],a:0,w:'الكابل الأرفع من اللازم يسخن، والقاطع غير المناسب لا يحمي الدائرة. الفني يحسب الحمل ثم يختار.',tip:'يستخدم الفني مواد مطابقة للمواصفات المعتمدة، وليس بالضرورة الأرخص.'},
{t:'٤. التوصيل',q:'ما الأسلاك الثلاثة في دائرة الإنارة، وما دور كل منها؟',o:['الفاز يغذّي، والمحايد يُكمل الدائرة، والأرضي للحماية','كلها تغذّي الإضاءة بنفس الدور','الأرضي هو الذي يشعل اللمبة'],a:0,w:'لكل سلك لون ودور محدد حسب المعيار المعتمد، والأرضي عادةً أخضر/أصفر. الخطأ في التوصيل خطر.',tip:'يتحقق الفني من ألوان الأسلاك وإحكام الربط قبل التشغيل، فالتوصيل المرخي يسبب الحرارة.'},
{t:'٥. السلامة',q:'ما فائدة التأريض وقاطع الحماية التفاضلي؟',o:['يزيّنان لوحة الكهرباء','يحميان الأرواح بقطع الكهرباء عند تسرّب التيار','يزيدان سطوع الإضاءة'],a:1,w:'عند تسرّب التيار قد يصبح الجسم المعدني خطرًا. القاطع التفاضلي والتأريض يقطعان التيار بسرعة.',tip:'يختبر الفني العزل والتأريض بأجهزة قياس قبل تسليم العمل، ولا يكتفي بالنظر.'},
{t:'٦. الاختبار والتشغيل',q:'قبل التسليم، ماذا يفعل الفني الأمين؟',o:['يشغّل ويغادر فورًا','يختبر كل إضاءة ومفتاح ودائرة ويراجع قائمة الفحص','يترك الأمر للصدفة'],a:1,w:'الفحص الكامل هو ما يميّز العمل المتقن عن العمل السريع.',tip:'يمرّ الفني على كل نقطة: الإضاءات، المفاتيح، القواطع، ثم يسلّم العمل بعد التأكد.'}
],n=0,pts=0,done=false,st=document.getElementById('stage'),sc=document.getElementById('score');
function esc(s){return s}
function render(){
 if(n>=S.length){return final()}
 var s=S[n],h='<div class="card"><h2>'+s.t+'</h2><p>'+s.q+'</p><div id="opts">';
 s.o.forEach(function(x,k){h+='<button class="opt" data-k="'+k+'">'+x+'</button>'});
 h+='</div><div class="fb" id="fb"></div><div id="after"></div></div>';
 st.innerHTML=h;
 var b=st.querySelectorAll('.opt');
 b.forEach(function(el){el.onclick=function(){pick(+el.dataset.k,b)}});
}
function pick(k,b){
 var s=S[n],fb=document.getElementById('fb');
 if(k===s.a){
  b[k].className='opt ok';pts+=10;sc.textContent='النقاط: '+pts;
  fb.textContent='✅ إجابة صحيحة. '+s.w;
  b.forEach(function(x){x.disabled=true});
  document.getElementById('after').innerHTML='<div class="tip"><b>لمسة الفني:</b> '+s.tip+'</div><button class="go" id="nx">'+(n<S.length-1?'المرحلة التالية':'تشغيل الإضاءة')+'</button>';
  document.getElementById('nx').onclick=function(){n++;render()};
 }else{
  b[k].className='opt bad';b[k].disabled=true;
  fb.textContent='لا بأس، جرّب مرة أخرى. تلميح: فكّر في السلامة والجودة.';
 }
}
function final(){
 st.innerHTML='<div class="card"><h2>٧. اضغط المفتاح</h2><p>اكتملت التمديدات والفحوصات. شغّل الإضاءة الآن.</p><button class="go" id="sw">💡 تشغيل المفتاح</button></div>';
 document.getElementById('sw').onclick=function(){
  document.getElementById('scene').classList.add('on');
  var l=document.querySelectorAll('.lamp'),k=0;
  var t=setInterval(function(){l[k].style.fill='#ffe9a8';l[k].style.filter='drop-shadow(0 0 7px #ffd35c)';k++;if(k>=l.length){clearInterval(t);cert()}},220);
  this.disabled=true;
 };
}
function cert(){
 st.innerHTML='<div class="card cert"><h2>🏅 أتممت رحلة الكهرباء</h2><p>نقاطك: '+pts+' من '+(S.length*10)+'</p><p>للتمديدات الكهربائية والإنارة بإتقان وأمانة، تواصل مع:</p><p><b style="font-size:1.25rem">الفني ثامر عبيدات</b><br>بني كنانة – حرثا</p><a href="tel:0797018788">0797018788</a><button class="go" id="again">إعادة اللعبة</button></div>';
 document.getElementById('again').onclick=function(){location.reload()};
}
document.getElementById('tog').onclick=function(){
 var sc2=document.getElementById('scene'),on=sc2.classList.toggle('show');
 this.textContent=on?'إخفاء الأسلاك':'إظهار الأسلاك المخفية';
};
render();
</script>
</body>
</html>
